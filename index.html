<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6efe4">
<title>空靈鼓練習室｜Joyful Drum HK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238b5a3c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e8c4a0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/teach.css">
</head>
<body>
<a class="skip" href="#view">跳到主要內容</a>
<header class="topbar">
  <a class="brand" href="#/" aria-label="空靈鼓練習室 首頁">
    <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#8b5a3c"/><circle cx="20" cy="20" r="14.5" fill="none" stroke="#e8c4a0" stroke-width="1"/><g stroke="#f6efe4" stroke-width="2.2" stroke-linecap="round"><path d="M20 7v6"/><path d="M29.2 10.8l-4.2 4.2"/><path d="M33 20h-6"/><path d="M29.2 29.2l-4.2-4.2"/><path d="M20 33v-6"/><path d="M10.8 29.2l4.2-4.2"/><path d="M7 20h6"/><path d="M10.8 10.8l4.2 4.2"/></g><circle cx="20" cy="20" r="3.2" fill="#e8c4a0"/></svg>
    <span><b>空靈鼓練習室</b><small>Joyful Drum HK</small></span>
  </a>
  <nav class="account" id="account" aria-label="會員"></nav>
</header>
<main id="view" tabindex="-1"></main>
<footer class="foot">
  <p>樂譜及錄音只供會員個人練習，不得轉載或分享。</p>
  <p>© Joyful Drum HK 空靈鼓</p>
</footer>

<dialog id="loginDialog" class="sheet" aria-labelledby="loginTitle">
  <form method="dialog" id="loginForm" novalidate>
    <h2 id="loginTitle">會員登入</h2>
    <p class="sheet-lead">登入後可以打開動態樂譜，並使用 3D／2D 跟敲模式。</p>
    <label>帳戶名稱<input name="username" autocomplete="username" required autocapitalize="off" spellcheck="false"></label>
    <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="form-error" role="alert" id="loginError"></p>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" data-close>取消</button>
      <button type="submit" class="btn primary" id="loginSubmit">登入</button>
    </div>
    <p class="sheet-note">還沒有帳戶？會員帳戶由老師開設，請向張老師查詢。</p>
  </form>
</dialog>

<template id="drumTeachingTemplate">
<dialog id="drumTeachingDialog" aria-label="空靈鼓教學畫面"><div id="drum-teaching-studio">
<div class="dl-native-top"><button class="dl-close" type="button">‹ 返回動態樂譜</button><label>畫面<select class="dl-view" aria-label="教學畫面"><option value="three">3D 立體</option><option value="flat">平面 2D</option></select></label></div>
  <div class="dl-native-views">
    <section data-view="three" aria-label="3D 沉浸教學">
      <div class="dl-window dl-three">
        <header class="dl-head"><h2>空靈鼓跟奏</h2><span class="dl-meta">空靈鼓練習室</span></header>
        <div class="dl-stage" data-scene="three" aria-label="立體空靈鼓，光點落到鼓面時敲擊">
          <canvas class="dl-backdrop" aria-hidden="true"></canvas><canvas class="dl-base" role="img" aria-label="立體花紋空靈鼓"></canvas><canvas class="dl-glow" aria-hidden="true"></canvas><div class="dl-labels"></div>
          <label class="dl-stage-caption dl-instrument"><span class="dl-drum-key">D 調</span><select class="dl-layout" aria-label="3D 鼓款"><option value="d11">11 音鼓</option><option value="d15">15 音鼓</option></select></label><div class="dl-error" role="alert" hidden></div>
          <div class="dl-now"><b class="dl-current">光落鼓面，輕輕敲奏</b></div>
        </div>
        <div class="dl-score" aria-label="同步單行簡譜">
          <div class="dl-score-head"><div><span class="dl-score-title">清露</span><span>1 = D　4/4</span></div><div class="dl-row-controls"><button class="dl-prev-row " type="button" aria-label="上一段樂譜">‹</button><span class="dl-row-label">第 1–2 小節</span><button class="dl-next-row " type="button" aria-label="下一段樂譜">›</button></div></div>
          <div class="dl-score-line" role="group" aria-label="當前一行樂譜"></div>
          <div class="dl-score-status"><span class="dl-score-hint">點選音符，由該處練習</span><span class="dl-score-position">每次一行</span></div>
        </div>
        <div class="dl-transport">
          <div class="dl-toolbar"><div class="dl-actions"><button class="dl-play" type="button"><span class="dl-play-icon" aria-hidden="true">▷</span><span>播放</span></button><button class="dl-stop" type="button" aria-label="停止演奏">停止</button><button class="dl-sound" type="button" aria-pressed="true" aria-label="開關聲音">聲音開</button></div><label class="dl-speed">速度<select aria-label="3D 版播放速度"></select></label></div>
          <div class="dl-progress" role="progressbar" aria-label="旋律進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
          <div class="dl-footnote"><span></span><span class="dl-time">0:00 / 0:30</span></div><span class="dl-status" aria-live="polite"></span>
        </div>
        <details class="dl-settings"><summary class="">畫面設定<span class="dl-settings-summary">青花纏枝蓮・星夜山台</span></summary>
          <div class="dl-options"><label class="dl-field">跟隨聲部<select class="dl-voice" aria-label="教學聲部"></select></label><label class="dl-field">鼓面花紋及顏色<select class="dl-pattern" aria-label="3D 鼓面花紋"></select></label><label class="dl-field">場景<select class="dl-scene" aria-label="3D 場景"></select></label><label class="dl-field">光束<select class="dl-beam" aria-label="3D 光束"></select></label></div>
          
          <div class="dl-finish"><label class="dl-glow-control"><span>光暈柔度 <output>64%</output></span><input class="dl-softness" type="range" min="0" max="100" value="64" aria-label="3D 光暈柔度"></label><label class="dl-ripple-control"><span>漣漪 <output>28%</output></span><input class="dl-ripple" type="range" min="0" max="100" value="28" aria-label="3D 漣漪強度"></label><label class="dl-score-toggle"><input class="dl-show-score" type="checkbox" checked>顯示一行樂譜</label></div>
        </details>
      </div>
    </section>
    <section data-view="flat" aria-label="平面清晰跟奏" hidden>
      <div class="dl-window dl-flat">
        <header class="dl-head"><h2>空靈鼓跟奏</h2><span class="dl-meta">空靈鼓練習室</span></header>
        <div class="dl-stage" data-scene="flat" aria-label="俯視空靈鼓，跟隨音位標記及下方樂譜敲擊">
          <canvas class="dl-backdrop" aria-hidden="true"></canvas><canvas class="dl-base" role="img" aria-label="平面俯視花紋空靈鼓"></canvas><canvas class="dl-glow" aria-hidden="true"></canvas><div class="dl-labels"></div>
          <label class="dl-stage-caption dl-instrument"><span class="dl-drum-key">D 調</span><select class="dl-layout" aria-label="平面鼓款"><option value="d11">11 音鼓</option><option value="d15">15 音鼓</option></select></label><div class="dl-now"><b class="dl-current">跟隨音位，輕輕敲奏</b><span>俯視跟奏</span></div>
        </div>
        <div class="dl-score" aria-label="同步單行簡譜">
          <div class="dl-score-head"><div><span class="dl-score-title">清露</span><span>1 = D　4/4</span></div><div class="dl-row-controls"><button class="dl-prev-row " type="button" aria-label="上一段樂譜">‹</button><span class="dl-row-label">第 1–2 小節</span><button class="dl-next-row " type="button" aria-label="下一段樂譜">›</button></div></div>
          <div class="dl-score-line" role="group" aria-label="當前一行樂譜"></div>
          <div class="dl-score-status"><span class="dl-score-hint">點選音符，由該處練習</span><span class="dl-score-position">每次一行</span></div>
        </div>
        <div class="dl-transport">
          <div class="dl-toolbar"><div class="dl-actions"><button class="dl-play" type="button"><span class="dl-play-icon" aria-hidden="true">▷</span><span>播放</span></button><button class="dl-stop" type="button" aria-label="停止演奏">停止</button><button class="dl-sound" type="button" aria-pressed="true" aria-label="開關聲音">聲音開</button></div><label class="dl-speed">速度<select aria-label="平面版播放速度"></select></label></div>
          <div class="dl-progress" role="progressbar" aria-label="旋律進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
          <div class="dl-footnote"><span></span><span class="dl-time">0:00 / 0:30</span></div><span class="dl-status" aria-live="polite"></span>
        </div>
        <details class="dl-settings"><summary class="">畫面設定<span class="dl-settings-summary">青花纏枝蓮・星夜山台</span></summary>
          <div class="dl-options"><label class="dl-field">跟隨聲部<select class="dl-voice" aria-label="教學聲部"></select></label><label class="dl-field">鼓面花紋及顏色<select class="dl-pattern" aria-label="平面鼓面花紋"></select></label><label class="dl-field">場景<select class="dl-scene" aria-label="平面場景"></select></label></div>
          
          <div class="dl-finish"><label class="dl-score-toggle"><input class="dl-show-score" type="checkbox" checked>顯示一行樂譜</label></div>
        </details>
      </div>
    </section>
  </div>
</div>
</dialog>
</template>


<script src="assets/js/config.js"></script>
<script src="assets/vendor/three.min.js" defer></script>
<script src="assets/js/drum-core.js" defer></script>
<script src="assets/js/teach-data.js" defer></script>
<script src="assets/js/teach.js" defer></script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
